[package]
name = "agentready"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agentready"
path = "src/main.rs"

[dependencies]
agentready-core = { version = "0.1.0", path = "../agentready-core" }
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
